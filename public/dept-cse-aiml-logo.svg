<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#0878FF" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
  </defs>

  <!-- Neural Network AI/ML Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#0F1C34" stroke="#00C8FF" stroke-width="1.5"/>
    <!-- Synapse Nodes -->
    <circle cx="18" cy="20" r="4" fill="#00C8FF"/>
    <circle cx="18" cy="40" r="4" fill="#00C8FF"/>
    <circle cx="32" cy="16" r="3.5" fill="#FFD700"/>
    <circle cx="32" cy="30" r="4.5" fill="#FFFFFF"/>
    <circle cx="32" cy="44" r="3.5" fill="#FFD700"/>
    <circle cx="46" cy="30" r="5" fill="#0878FF" stroke="#00C8FF" stroke-width="1.5"/>
    
    <!-- Connectors -->
    <line x1="18" y1="20" x2="32" y2="16" stroke="#00C8FF" stroke-width="1.2" opacity="0.7"/>
    <line x1="18" y1="20" x2="32" y2="30" stroke="#00C8FF" stroke-width="1.2" opacity="0.7"/>
    <line x1="18" y1="40" x2="32" y2="30" stroke="#00C8FF" stroke-width="1.2" opacity="0.7"/>
    <line x1="18" y1="40" x2="32" y2="44" stroke="#00C8FF" stroke-width="1.2" opacity="0.7"/>
    <line x1="32" y1="16" x2="46" y2="30" stroke="#FFD700" stroke-width="1.2" opacity="0.7"/>
    <line x1="32" y1="30" x2="46" y2="30" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="32" y1="44" x2="46" y2="30" stroke="#FFD700" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Typography -->
  <g transform="translate(80, 18)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      DEPT. OF CSE (AI &amp; ML)
    </text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#00C8FF" letter-spacing="0.5">
      SCHOOL OF COMPUTING
    </text>
    <text x="0" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#7F8DA3" letter-spacing="1">
      VEL TECH UNIVERSITY
    </text>
  </g>
</svg>
